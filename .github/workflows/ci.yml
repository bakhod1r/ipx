name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go: ["1.24", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - name: coverage must stay 100%
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ]
      - name: fuzz (short)
        run: |
          for f in FuzzRangePrefixes FuzzParseNoPanic FuzzSetAlgebra FuzzTableVsLinear; do
            go test -run XXX -fuzz "^$f\$" -fuzztime 15s .
          done
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
